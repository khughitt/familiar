name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: npm ci
      # The Noctalia plugin's contract tests run under the pinned Luau 0.743 runtime.
      - run: node tools/fetch-luau.mjs
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh kitty-terminfo
      - run: python3 tools/tt ci-test -- npm test
      - run: python3 tools/tt ci-test -- npm run test:slow
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: clean-clone install smoke
        run: |
          cp -r . "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          rm -rf node_modules package-lock.json .git
          npm install
          ./bin/familiar --help
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tools/fetch-luau.mjs
      - name: fast suite with Darwin tests enforced
        # The per-user TMPDIR under /private/var/folders is too long for the suite's
        # Unix-socket fixtures (macOS holds 103 bytes); the runner refuses it.
        env:
          TMPDIR: /tmp
        run: |
          set -o pipefail
          python3 tools/tt ci-test -- npm test 2>&1 | tee "$RUNNER_TEMP/familiar-tests.log"
          # Not `! grep`: errexit ignores a negated command, so that form never fails the
          # step. Node prints a skipped test's name too, so the name checks below need this.
          if grep -F 'requires Darwin' "$RUNNER_TEMP/familiar-tests.log"; then exit 1; fi
          grep -F 'Darwin real per-pid reads keep this process identity stable' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'Darwin ps keeps comm last and canonicalizes tty' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'Darwin copies a stable local pack through its pathname walker' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'an atomic intent commit wakes a directory watcher on this platform' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'intent-watch filenames on darwin:' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'without a readable boot ID a saved health record never reads healthy and claims nothing' "$RUNNER_TEMP/familiar-tests.log"
      - name: linked command smoke
        run: |
          set -o pipefail
          npm link
          familiar --help
          familiar setup claude-code | node -e '
            let text = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(text);
              if (JSON.stringify(Object.keys(value)) !== JSON.stringify(["statusLine"])
                  || value.statusLine.type !== "command"
                  || !/^\x27\/.+\/bin\/familiar\x27 statusline$/.test(value.statusLine.command)
                  || value.statusLine.refreshInterval !== 2) process.exit(1);
            });
          '
          familiar setup relay | node -e '
            let text = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(text);
              const names = ["familiar", "familiar-opencode", "familiar-teardown"];
              const bins = new Set(value.subscribers.map(entry => entry.argv[0]));
              const [bin] = bins;
              if (value.schema !== 1
                  || JSON.stringify(value.subscribers.map(entry => entry.name)) !== JSON.stringify(names)
                  || !value.subscribers.every(entry => entry.role === "observer" && entry.argv.length === 2 && entry.argv[1] === "observe")
                  || bins.size !== 1 || !bin.startsWith("/") || !bin.endsWith("/bin/familiar")) process.exit(1);
            });
          '
          # Hooks moved to relay; setup codex is a usage error, not empty settings.
          status=0
          familiar setup codex 2>/dev/null || status=$?
          test "$status" -eq 2

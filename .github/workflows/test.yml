name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: clean-clone install smoke
        run: |
          cp -r . "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          rm -rf node_modules package-lock.json .git
          npm install
          ./bin/familiar --help
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: fast suite with Darwin tests enforced
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/familiar-tests.log"
          ! grep -F 'requires Darwin' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'Darwin real snapshot keeps this process identity stable' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'Darwin ps keeps comm last and canonicalizes tty' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'Darwin copies a stable local pack through its pathname walker' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'an atomic intent commit wakes a directory watcher on this platform' "$RUNNER_TEMP/familiar-tests.log"
          grep -F 'intent-watch filenames on darwin:' "$RUNNER_TEMP/familiar-tests.log"
      - name: linked command smoke
        run: |
          set -o pipefail
          npm link
          familiar --help
          familiar setup claude-code | node -e '
            let text = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(text);
              const hooks = ["SessionStart", "UserPromptSubmit", "PreToolUse", "Notification", "Stop", "StopFailure", "SessionEnd"];
              if (JSON.stringify(Object.keys(value.hooks ?? {})) !== JSON.stringify(hooks)
                  || !hooks.every(name => value.hooks[name].length > 0)
                  || !value.hooks.SessionEnd[0].hooks[0].command.endsWith(" hook SessionEnd")
                  || value.statusLine?.type !== "command"
                  || !value.statusLine.command.endsWith(" statusline")
                  || value.statusLine.refreshInterval !== 2) process.exit(1);
            });
          '
          familiar setup codex | node -e '
            let text = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => text += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(text);
              const hooks = ["SessionStart", "UserPromptSubmit", "PreToolUse", "PermissionRequest", "Stop", "SessionEnd"];
              if (JSON.stringify(Object.keys(value.hooks ?? {})) !== JSON.stringify(hooks)
                  || !hooks.every(name => value.hooks[name].length > 0)
                  || !value.hooks.SessionEnd[0].hooks[0].command.endsWith(" hook SessionEnd --agent codex")
                  || value.statusLine !== undefined) process.exit(1);
            });
          '

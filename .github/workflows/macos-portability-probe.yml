name: macOS portability probe

on:
  push:
    branches: [docs/macos-support-design]

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe fd traversal
        run: |
          node --input-type=module <<'NODE'
          import {
            closeSync, constants, lstatSync, mkdirSync, mkdtempSync, openSync,
            readdirSync, readlinkSync, rmSync, writeFileSync,
          } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';

          const root = mkdtempSync(join(tmpdir(), 'familiar-fd-probe-'));
          const dir = join(root, 'dir');
          mkdirSync(dir);
          writeFileSync(join(dir, 'child.txt'), 'probe');
          const fd = openSync(dir, constants.O_RDONLY | constants.O_DIRECTORY | constants.O_NOFOLLOW);
          const bound = `/dev/fd/${fd}`;
          const attempt = (name, fn) => {
            try { console.log(JSON.stringify({ name, ok: true, value: fn() })); }
            catch (error) {
              console.log(JSON.stringify({
                name, ok: false, code: error.code, syscall: error.syscall, message: error.message,
              }));
            }
          };
          try {
            attempt('readlink-bound', () => readlinkSync(bound));
            attempt('readdir-bound', () => readdirSync(bound));
            attempt('lstat-child', () => lstatSync(join(bound, 'child.txt')).isFile());
            attempt('open-child', () => {
              const child = openSync(join(bound, 'child.txt'), constants.O_RDONLY | constants.O_NOFOLLOW);
              closeSync(child);
              return true;
            });
          } finally {
            closeSync(fd);
            rmSync(root, { recursive: true, force: true });
          }
          NODE
      - name: Probe BSD ps under a pseudo-TTY
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/Some App"
          mkdir -p "$probe_dir"
          cp /bin/sleep "$probe_dir/probe-agent"
          script -q "$RUNNER_TEMP/tty.typescript" /usr/bin/tty >/dev/null 2>&1
          echo '--- tty command output ---'
          sed -n '1,20p' "$RUNNER_TEMP/tty.typescript"
          transcript="$RUNNER_TEMP/script.typescript"
          script -q "$transcript" "$probe_dir/probe-agent" 30 >/dev/null 2>&1 &
          script_pid=$!
          sleep 2
          echo '--- relevant process rows: comm last ---'
          ps -axo pid=,ppid=,tty=,lstart=,comm= | grep -E 'script|probe-agent' || true
          echo '--- relevant process rows: command last ---'
          ps -axo pid=,ppid=,tty=,lstart=,command= | grep -E 'script|probe-agent' || true
          kill "$script_pid" 2>/dev/null || true
          pkill -f "$probe_dir/probe-agent" 2>/dev/null || true
          wait "$script_pid" 2>/dev/null || true
      - name: Probe current agent executables
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code @openai/codex opencode-ai
          for agent in claude codex opencode; do
            bin=$(command -v "$agent")
            echo "--- $agent executable ---"
            ls -l "$bin"
            file "$bin"
            tail -f /dev/null | script -q "$RUNNER_TEMP/$agent.typescript" \
              /usr/bin/env TERM=xterm-kitty COLORTERM=truecolor "$bin" >/dev/null 2>&1 &
            script_pid=$!
            sleep 3
            echo "--- $agent transcript ---"
            sed -n '1,20p' "$RUNNER_TEMP/$agent.typescript" || true
            pids="$script_pid"
            frontier="$script_pid"
            for _depth in 1 2 3 4; do
              next=''
              for parent in $frontier; do
                children=$(pgrep -P "$parent" || true)
                next="$next $children"
              done
              [ -n "${next// /}" ] || break
              pids="$pids $next"
              frontier="$next"
            done
            echo "--- $agent process rows: comm last ---"
            for pid in $pids; do ps -p "$pid" -o pid=,ppid=,tty=,lstart=,comm= || true; done
            echo "--- $agent process rows: command last ---"
            for pid in $pids; do ps -p "$pid" -o pid=,ppid=,tty=,lstart=,command= || true; done
            kill "$script_pid" 2>/dev/null || true
            pkill -f "$bin" 2>/dev/null || true
            wait "$script_pid" 2>/dev/null || true
          done

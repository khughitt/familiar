# The guild family: its summary, members and README contract. The home is ops, which
# lists itself as a member and reads this file at its root; each other member holds a
# copy as tools/family.toml, from which ops-docs renders the family region into the
# member's guides. Until every member holds a copy, members take it by hand from ops's
# HEAD (`git -C <ops> show HEAD:family.toml > tools/family.toml`), never through
# `family publish`, and `bin/ops-docs family check` runs here by hand as the rollout's
# progress report. Contract and staged adoption: docs/project-guides.md.
name = "guild"
summary = """
guild is the agent tooling behind every project here: the tracker, harness homes,
instruction context, adapters, flows, evidence, orchestration and companions, built
to run together on one host.
"""
overview = "https://github.com/khughitt/ops#readme"

# Members in nav order, alphabetical by shown text. `name` is the member's identity.toml
# name; `prefix` its tasks prefix; `label` the hover text of its nav link; optional
# `title` the nav text in place of the name. band, transponder and forge v2 have no
# repository yet: their URLs are the names their publication tasks create.
[[members]]
name = "band"
prefix = "band"
url = "https://github.com/khughitt/band"
label = "Single- and multi-agent orchestration across harnesses"

[[members]]
name = "familiar"
prefix = "fam"
url = "https://github.com/khughitt/familiar"
label = "Agent pets and the session hook bus"

